<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuck Norris Fact Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            width: 90%;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            font-size: 3.5em;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.3em;
            margin-bottom: 40px;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .joke-container {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .joke-container:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .joke-text {
            font-size: 1.4em;
            line-height: 1.6;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .btn-container {
            margin: 40px 0;
        }

        .joke-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .joke-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            background: linear-gradient(45deg, #ee5a24, #ff6b6b);
        }

        .joke-btn:active {
            transform: translateY(-1px);
        }

        .joke-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .joke-btn:hover::before {
            left: 100%;
        }

        .loading {
            font-size: 1.2em;
            opacity: 0.8;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            margin-top: 30px;
            font-size: 1.1em;
            opacity: 0.8;
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-element {
            position: absolute;
            opacity: 0.1;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
            }
        }

        .error {
            color: #ff6b6b;
            font-size: 1.2em;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5em;
            }
            
            .container {
                padding: 20px;
                margin: 20px;
            }
            
            .joke-text {
                font-size: 1.2em;
            }
            
            .joke-btn {
                padding: 15px 30px;
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="floating-elements"></div>
    
    <div class="container">
        <h1 class="title">Chuck Norris</h1>
        <p class="subtitle">Legendary Facts Generator</p>
        
        <div class="joke-container">
            <div class="joke-text" id="jokeText">
                Click the button below to discover a legendary Chuck Norris fact!
            </div>
        </div>
        
        <div class="btn-container">
            <button class="joke-btn" id="jokeBtn" onclick="getJoke()">
                Get New Fact
            </button>
        </div>
        
        <div class="stats">
            <p>Facts discovered: <span id="jokeCount">0</span></p>
        </div>
    </div>

    <script>
        let jokeCount = 0;

        // Create floating background elements
        function createFloatingElements() {
            const container = document.querySelector('.floating-elements');
            const symbols = ['⭐', '💪', '🥊', '⚡', '🔥'];
            
            for (let i = 0; i < 15; i++) {
                const element = document.createElement('div');
                element.className = 'floating-element';
                element.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                element.style.left = Math.random() * 100 + '%';
                element.style.fontSize = (Math.random() * 30 + 20) + 'px';
                element.style.animationDelay = Math.random() * 15 + 's';
                element.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(element);
            }
        }

        async function getJoke() {
            const jokeText = document.getElementById('jokeText');
            const jokeBtn = document.getElementById('jokeBtn');
            
            // Show loading state
            jokeBtn.innerHTML = '<div class="spinner"></div>Getting fact...';
            jokeBtn.disabled = true;
            jokeText.innerHTML = '<div class="loading">Preparing legendary fact...</div>';
            
            try {
                const response = await fetch('https://api.chucknorris.io/jokes/random');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }
                
                const data = await response.json();
                
                // Add a small delay for dramatic effect
                setTimeout(() => {
                    jokeText.innerHTML = data.value;
                    jokeCount++;
                    document.getElementById('jokeCount').textContent = jokeCount;
                    
                    // Reset button
                    jokeBtn.innerHTML = 'Get New Fact';
                    jokeBtn.disabled = false;
                }, 800);
                
            } catch (error) {
                jokeText.innerHTML = '<div class="error">Chuck Norris is too powerful for the internet right now. Try again!</div>';
                jokeBtn.innerHTML = 'Try Again';
                jokeBtn.disabled = false;
                console.error('Error fetching joke:', error);
            }
        }

        // Auto-load a joke when page loads
        window.addEventListener('load', () => {
            createFloatingElements();
            setTimeout(getJoke, 1000);
        });

        // Add keyboard shortcut (spacebar)
        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space' && !document.getElementById('jokeBtn').disabled) {
                event.preventDefault();
                getJoke();
            }
        });
    </script>
</body>
</html>
