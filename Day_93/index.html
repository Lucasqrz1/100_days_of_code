            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #f0f0f0;
        }

        .header h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .header p {
            color: #666;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .player-info {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .info-item {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        .info-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30, 60, 114, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e8;
            color: #2e7d32;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .data-preview {
            margin-top: 30px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .data-table th {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .data-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s ease;
        }

        .data-table tr:hover {
            background: #f8f9fa;
        }

        .data-table tr:nth-child(even) {
            background: #fafafa;
        }

        .csv-output {
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            overflow-x: auto;
            white-space: pre;
            margin-top: 20px;
            border: 2px solid #333;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1e3c72;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1e3c72;
            margin: 30px 0 15px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .data-source {
            background: #f8f9fa;
            padding: 15px;
            border-left: 4px solid #1e3c72;
            margin: 20px 0;
            border-radius: 0 10px 10px 0;
        }

        .download-area {
            background: #f0f8ff;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
            border: 2px dashed #1e3c72;
        }

        .download-area h3 {
            color: #1e3c72;
            margin-bottom: 15px;
        }
    </style>

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = type === 'loading' ? `<div class="spinner"></div>${message}` : message;
            statusDiv.className = `status ${type}`;
        }

        function scrapeCareerStats() {
            showStatus('Extracting career statistics...', 'loading');
            
            setTimeout(() => {
                scrapedData = jaylenBrownData.careerStats;
                currentDataType = 'career';
                displayData(scrapedData, 'Career Statistics');
                showStatus(`Successfully scraped ${scrapedData.length} seasons of career data!`, 'success');
                document.getElementById('exportBtn').disabled = false;
            }, 1500);
        }

        function scrapeSeasonStats() {
            showStatus('Extracting current season statistics...', 'loading');
            
            setTimeout(() => {
                scrapedData = [jaylenBrownData.careerStats[jaylenBrownData.careerStats.length - 1]];
                currentDataType = 'season';
                displayData(scrapedData, '2024-25 Season Statistics');
                showStatus('Current season data extracted successfully!', 'success');
                document.getElementById('exportBtn').disabled = false;
            }, 1000);
        }

        function scrapeGameLogs() {
            showStatus('Extracting recent game logs...', 'loading');
            
            setTimeout(() => {
                scrapedData = jaylenBrownData.recentGames;
                currentDataType = 'games';
                displayData(scrapedData, 'Recent Game Logs');
                showStatus(`Scraped ${scrapedData.length} recent games!`, 'success');
                document.getElementById('exportBtn').disabled = false;
            }, 1200);
        }

        function displayData(data, title) {
            if (!data || data.length === 0) return;

            const previewDiv = document.getElementById('dataPreview');
            const keys = Object.keys(data[0]);
            
            let html = `
                <div class="section-title">${title}</div>
                <div class="data-source">
                    <strong>Data Source:</strong> Simulated NBA.com / Basketball-Reference.com scraping
                    <br><strong>Records:</strong> ${data.length} entries
                    <br><strong>Last Updated:</strong> ${new Date().toLocaleString()}
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                ${keys.map(key => `<th>${formatColumnName(key)}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(row => `
                                <tr>
                                    ${keys.map(key => `<td>${formatValue(row[key], key)}</td>`).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                <div class="download-area">
                    <h3>📊 Ready to Export</h3>
                    <p>Your scraped data is ready! Click the "Export to CSV" button to download.</p>
                </div>
            `;
            
            previewDiv.innerHTML = html;
        }

        function formatColumnName(key) {
            return key.replace(/_/g, ' ').toUpperCase();
        }

        function formatValue(value, key) {
            if (key.includes('percentage') && typeof value === 'number') {
                return (value * 100).toFixed(1) + '%';
            }
            if (typeof value === 'number' && value % 1 !== 0) {
                return value.toFixed(1);
            }
            return value;
        }

        function exportToCSV() {
            if (!scrapedData.length) return;

            const headers = Object.keys(scrapedData[0]);
            let csv = headers.join(',') + '\n';
            
            scrapedData.forEach(row => {
                const values = headers.map(header => {
                    let value = row[header];
                    if (typeof value === 'string' && value.includes(',')) {
                        value = `"${value}"`;
                    }
                    return value;
                });
                csv += values.join(',') + '\n';
            });

            // Display CSV preview
            const previewDiv = document.getElementById('dataPreview');
            previewDiv.innerHTML += `
                <div class="section-title">📄 CSV Output Preview</div>
                <div class="csv-output">${csv}</div>
            `;

            // Create and trigger download
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `jaylen_brown_${currentDataType}_stats_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showStatus('CSV file downloaded successfully! 🎉', 'success');
        }

        // Initialize with a welcome message
        window.onload = function() {
