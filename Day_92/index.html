<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Color Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-section:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-2px);
        }

        .upload-section.dragover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 15px;
        }

        .upload-subtext {
            color: #888;
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .results-container {
            display: none;
            margin-top: 30px;
        }

        .image-preview {
            text-align: center;
            margin-bottom: 30px;
        }

        .preview-img {
            max-width: 400px;
            max-height: 300px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .preview-img:hover {
            transform: scale(1.05);
        }

        .colors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .color-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .color-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .color-swatch {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .color-card:hover .color-swatch {
            transform: rotate(10deg) scale(1.1);
        }

        .color-info {
            font-size: 0.9rem;
        }

        .color-hex {
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background: #f8f9fa;
            padding: 5px 10px;
            border-radius: 20px;
            margin: 5px 0;
            color: #333;
        }

        .color-percentage {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Color Analyzer</h1>
            <p>Upload an image to discover its most dominant colors</p>
        </div>

        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Drop your image here or click to browse</div>
            <div class="upload-subtext">Supports JPG, PNG, GIF, and other common formats</div>
            <button class="btn" onclick="document.getElementById('fileInput').click()">
                Choose Image
            </button>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            Analyzing colors... This might take a moment for large images.
        </div>

        <div class="results-container" id="results">
            <div class="image-preview" id="imagePreview"></div>
            <div class="stats" id="stats"></div>
            <div class="colors-grid" id="colorsGrid"></div>
        </div>
    </div>

    <script>
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const imagePreview = document.getElementById('imagePreview');
        const colorsGrid = document.getElementById('colorsGrid');
        const stats = document.getElementById('stats');

        // Drag and drop functionality
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleImageUpload(files[0]);
            }
        });

        uploadSection.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleImageUpload(e.target.files[0]);
            }
        });

        function handleImageUpload(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please select a valid image file.');
                return;
            }

            // Show loading
            loading.style.display = 'block';
            results.style.display = 'none';
            uploadSection.style.display = 'none';

            const reader = new FileReader();
            reader.onload = (e) => {
                analyzeImage(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function analyzeImage(imageSrc) {
            const img = new Image();
            img.onload = () => {
                // Show image preview
                imagePreview.innerHTML = `<img src="${imageSrc}" alt="Uploaded image" class="preview-img">`;

                // Create canvas for color analysis
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // Scale down large images for faster processing
                const maxSize = 400;
                let { width, height } = img;
                if (width > maxSize || height > maxSize) {
                    const ratio = Math.min(maxSize / width, maxSize / height);
                    width *= ratio;
                    height *= ratio;
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                // Get image data
                const imageData = ctx.getImageData(0, 0, width, height);
                const data = imageData.data;

                // Analyze colors
                const colorMap = new Map();
                let totalPixels = 0;

                // Sample every few pixels for better performance
                const step = Math.max(1, Math.floor(data.length / 40000)); // Limit to ~10k pixels

                for (let i = 0; i < data.length; i += 4 * step) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    const a = data[i + 3];

                    // Skip transparent pixels
                    if (a < 128) continue;

                    // Group similar colors (reduce precision)
                    const groupedR = Math.floor(r / 8) * 8;
                    const groupedG = Math.floor(g / 8) * 8;
                    const groupedB = Math.floor(b / 8) * 8;

                    const colorKey = `${groupedR},${groupedG},${groupedB}`;
                    colorMap.set(colorKey, (colorMap.get(colorKey) || 0) + 1);
                    totalPixels++;
                }

                // Sort colors by frequency
                const sortedColors = Array.from(colorMap.entries())
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 12); // Top 12 colors

                // Display results
                displayResults(sortedColors, totalPixels, img.naturalWidth, img.naturalHeight);
            };
            img.src = imageSrc;
        }

        function displayResults(colors, totalPixels, originalWidth, originalHeight) {
            // Hide loading
            loading.style.display = 'none';
            results.style.display = 'block';

            // Show stats
            const uniqueColors = colors.length;
            const dominantPercentage = colors.length > 0 ? ((colors[0][1] / totalPixels) * 100).toFixed(1) : 0;

            stats.innerHTML = `
                <h3>🔍 Analysis Results</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-number">${originalWidth}×${originalHeight}</div>
                        <div class="stat-label">Image Size</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${uniqueColors}</div>
                        <div class="stat-label">Dominant Colors</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${dominantPercentage}%</div>
                        <div class="stat-label">Most Common</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${totalPixels.toLocaleString()}</div>
                        <div class="stat-label">Pixels Analyzed</div>
                    </div>
                </div>
            `;

            // Display color cards
            colorsGrid.innerHTML = colors.map(([colorKey, count], index) => {
                const [r, g, b] = colorKey.split(',').map(Number);
                const percentage = ((count / totalPixels) * 100).toFixed(1);
                const hex = rgbToHex(r, g, b);
                const textColor = getTextColor(r, g, b);

                return `
                    <div class="color-card">
                        <div class="color-swatch" style="background-color: rgb(${r}, ${g}, ${b})"></div>
                        <div class="color-info">
                            <div class="color-hex" style="color: ${textColor}; background: rgb(${r}, ${g}, ${b})">${hex}</div>
                            <div>RGB: ${r}, ${g}, ${b}</div>
                            <div class="color-percentage">${percentage}%</div>
                            <div style="font-size: 0.8rem; color: #888; margin-top: 5px;">
                                Rank #${index + 1}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Add reset button
            uploadSection.style.display = 'block';
            uploadSection.innerHTML = `
                <div class="upload-icon">✨</div>
                <div class="upload-text">Analysis Complete!</div>
                <div class="upload-subtext">Upload another image to analyze more colors</div>
                <button class="btn" onclick="resetApp()">Analyze Another Image</button>
            `;
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
        }

        function getTextColor(r, g, b) {
            // Calculate luminance
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance > 0.5 ? '#000000' : '#FFFFFF';
        }

        function resetApp() {
            results.style.display = 'none';
            uploadSection.innerHTML = `
                <div class="upload-icon">📸</div>
                <div class="upload-text">Drop your image here or click to browse</div>
                <div class="upload-subtext">Supports JPG, PNG, GIF, and other common formats</div>
                <button class="btn" onclick="document.getElementById('fileInput').click()">
                    Choose Image
                </button>
            `;
        }
    </script>
</body>
</html>
